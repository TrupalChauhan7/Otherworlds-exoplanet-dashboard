name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: R tests
    runs-on: ubuntu-latest
    env:
      # .Rprofile now auto-loads renv; disable it so CI uses the
      # runner's freshly installed packages instead of a project library.
      RENV_CONFIG_AUTOLOADER_ENABLED: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: |
          install.packages(c(
            "testthat", "ggplot2", "scales", "dplyr", "readr", "forcats"
          ))

      - name: Run test suite
        shell: Rscript {0}
        run: |
          library(testthat)
          test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)
